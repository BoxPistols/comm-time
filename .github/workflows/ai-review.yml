name: AI Code Review

# 2026-07-26 修理:
# - script ブロック内の JS テンプレートリテラル継続行がカラム0にあり YAML パース不能だった
#   (2026-01-03 の導入以降、全 push が 0 秒 failure)。プロンプトは配列 join / heredoc 化した
# - モデル ID を現行化 (gemini-3.6-flash / openai/gpt-4o / claude-sonnet-4-6)。
#   models.github.ai/inference は provider/name 形式が必須
# - diff・PR 本文・モデル出力の ${{ }} 生埋め込みを env 経由に変更
#   (バッククォート含む出力で JS が壊れる + スクリプトインジェクションになるため)
# - curl の JSON ペイロードを jq で組み立て (改行・引用符の生埋め込みで JSON が壊れていた)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

env:
  # Gemini設定
  GEMINI_MODEL: gemini-3.6-flash
  GEMINI_MODEL_DISPLAY: Gemini 3.6 Flash
  # GitHub Models設定 (Copilot経由)
  GITHUB_MODEL: openai/gpt-4o
  GITHUB_MODEL_DISPLAY: GitHub Copilot (GPT-4o)
  # Claude設定
  CLAUDE_MODEL: claude-sonnet-4-6
  CLAUDE_MODEL_DISPLAY: Claude Sonnet 4.6

jobs:
  # ============================================
  # Gemini Commands: /review, /summary, /fix
  # ============================================
  gemini-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      !contains(github.event.comment.body, '/copilot_review') &&
      !contains(github.event.comment.body, '/claude_review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return { base: pr.data.base.sha, head: pr.data.head.sha, branch: pr.data.head.ref };

      - name: Get diff
        id: diff
        # ブランチ名は PR 作成者が決められる値のため、シェルへは env 経由で渡す
        env:
          BASE: ${{ fromJson(steps.pr.outputs.result).base }}
          HEAD: ${{ fromJson(steps.pr.outputs.result).head }}
          BRANCH: ${{ fromJson(steps.pr.outputs.result).branch }}
        run: |
          git fetch origin "$BRANCH"
          DIFF=$(git diff "$BASE".."$HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.css' '*.json' | head -c 30000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Review with Gemini
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "result=⚠️ GEMINI_API_KEY が設定されていません" >> $GITHUB_OUTPUT
            exit 0
          fi
          cat > prompt.txt <<'EOT'
          あなたは経験豊富なシニアエンジニアです。以下のコード差分をレビューしてください。

          ## レビュー観点
          1. バグや潜在的な問題
          2. セキュリティリスク
          3. パフォーマンス改善点
          4. コードの可読性・保守性
          5. ベストプラクティスへの準拠

          ## 出力形式
          - 問題がある場合は具体的なファイル名と行を示してください
          - 改善案があれば具体的なコード例を提示してください
          - 問題がなければ「LGTM」と回答してください

          ## コード差分
          EOT
          printf '```diff\n%s\n```\n' "$DIFF" >> prompt.txt
          PAYLOAD=$(jq -n --rawfile p prompt.txt \
            '{contents:[{parts:[{text:$p}]}],generationConfig:{temperature:0.2,maxOutputTokens:4096}}')
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$GEMINI_MODEL:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            ERROR=$(echo "$BODY" | jq -r '.error.message // "Unknown error"')
            echo "result=⚠️ API Error (HTTP $HTTP_CODE): $ERROR" >> $GITHUB_OUTPUT
          else
            RESULT=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // "レビューを生成できませんでした"')
            echo "result<<EOF" >> $GITHUB_OUTPUT
            echo "$RESULT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post comment
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.review.outputs.result }}
        with:
          script: |
            const body = ['## 🤖 AI Code Review', '', process.env.RESULT, '', '---', `*Powered by ${process.env.GEMINI_MODEL_DISPLAY}*`].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  gemini-summary:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/summary') &&
      !contains(github.event.comment.body, '/copilot_summary') &&
      !contains(github.event.comment.body, '/claude_summary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              title: pr.data.title,
              body: pr.data.body || '',
              base: pr.data.base.sha,
              head: pr.data.head.sha,
              branch: pr.data.head.ref,
              commits: commits.data.map(c => c.commit.message).join('\n')
            };

      - name: Get changed files
        id: files
        env:
          BASE: ${{ fromJson(steps.pr.outputs.result).base }}
          HEAD: ${{ fromJson(steps.pr.outputs.result).head }}
          BRANCH: ${{ fromJson(steps.pr.outputs.result).branch }}
        run: |
          git fetch origin "$BRANCH"
          FILES=$(git diff --name-status "$BASE".."$HEAD")
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate summary with Gemini
        id: summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ fromJson(steps.pr.outputs.result).title }}
          PR_BODY: ${{ fromJson(steps.pr.outputs.result).body }}
          PR_COMMITS: ${{ fromJson(steps.pr.outputs.result).commits }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "result=⚠️ GEMINI_API_KEY が設定されていません" >> $GITHUB_OUTPUT
            exit 0
          fi
          cat > prompt.txt <<'EOT'
          以下のPull Request情報から、簡潔で分かりやすいサマリーを日本語で作成してください。

          ## 出力形式
          ### 概要
          （1-2文で変更の目的を説明）

          ### 主な変更点
          - 箇条書きで主要な変更を列挙

          ### 影響範囲
          - 影響を受けるコンポーネントや機能

          ### レビューポイント
          - レビュアーが特に確認すべき点

          ---

          ## PR情報
          EOT
          printf 'タイトル: %s\n\n説明:\n%s\n\nコミット:\n%s\n\n変更ファイル:\n%s\n' \
            "$PR_TITLE" "$PR_BODY" "$PR_COMMITS" "$FILES" >> prompt.txt
          PAYLOAD=$(jq -n --rawfile p prompt.txt \
            '{contents:[{parts:[{text:$p}]}],generationConfig:{temperature:0.3,maxOutputTokens:2048}}')
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$GEMINI_MODEL:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            ERROR=$(echo "$BODY" | jq -r '.error.message // "Unknown error"')
            echo "result=⚠️ API Error (HTTP $HTTP_CODE): $ERROR" >> $GITHUB_OUTPUT
          else
            RESULT=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // "サマリーを生成できませんでした"')
            echo "result<<EOF" >> $GITHUB_OUTPUT
            echo "$RESULT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post comment
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.summary.outputs.result }}
        with:
          script: |
            const body = ['## 📋 PR Summary', '', process.env.RESULT, '', '---', `*Powered by ${process.env.GEMINI_MODEL_DISPLAY}*`].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  gemini-fix:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/fix') &&
      !contains(github.event.comment.body, '/copilot_fix') &&
      !contains(github.event.comment.body, '/claude_fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          gh pr diff ${{ github.event.issue.number }} > diff.txt
          DIFF=$(cat diff.txt | head -c 25000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate fix with Gemini
        id: fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "result=⚠️ GEMINI_API_KEY が設定されていません" >> $GITHUB_OUTPUT
            exit 0
          fi
          cat > prompt.txt <<'EOT'
          以下のコード差分を分析し、具体的な修正提案を行ってください。

          ## 出力形式
          各問題について以下の形式で出力:

          ### 問題 1: [問題のタイトル]
          **ファイル**: `path/to/file.ts`
          **問題点**: 問題の説明
          **修正前**:
          ```typescript
          // 現在のコード
          ```
          **修正後**:
          ```typescript
          // 修正したコード
          ```

          ---

          ## コード差分
          EOT
          printf '```diff\n%s\n```\n' "$DIFF" >> prompt.txt
          PAYLOAD=$(jq -n --rawfile p prompt.txt \
            '{contents:[{parts:[{text:$p}]}],generationConfig:{temperature:0.2,maxOutputTokens:4096}}')
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$GEMINI_MODEL:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            ERROR=$(echo "$BODY" | jq -r '.error.message // "Unknown error"')
            echo "result=⚠️ API Error (HTTP $HTTP_CODE): $ERROR" >> $GITHUB_OUTPUT
          else
            RESULT=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // "修正提案を生成できませんでした"')
            echo "result<<EOF" >> $GITHUB_OUTPUT
            echo "$RESULT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post comment
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.fix.outputs.result }}
        with:
          script: |
            const body = ['## 🔧 Fix Suggestions', '', process.env.RESULT, '', '---', `*Powered by ${process.env.GEMINI_MODEL_DISPLAY}*`].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ============================================
  # GitHub Copilot Commands: /copilot_review, /copilot_summary, /copilot_fix
  # ============================================
  copilot-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/copilot_review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          gh pr diff ${{ github.event.issue.number }} > diff.txt
          DIFF=$(cat diff.txt | head -c 30000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review with GitHub Models
        id: review
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF: ${{ steps.diff.outputs.diff }}
        with:
          script: |
            const diff = process.env.DIFF;
            const prompt = [
              'あなたは経験豊富なシニアエンジニアです。以下のコード差分をレビューしてください。',
              '',
              '## レビュー観点',
              '1. バグや潜在的な問題',
              '2. セキュリティリスク',
              '3. パフォーマンス改善点',
              '4. コードの可読性・保守性',
              '5. ベストプラクティスへの準拠',
              '',
              '## 出力形式',
              '- 問題がある場合は具体的なファイル名と行を示してください',
              '- 改善案があれば具体的なコード例を提示してください',
              '- 問題がなければ「LGTM」と回答してください',
              '',
              '## コード差分',
              '```diff',
              diff,
              '```',
            ].join('\n');

            try {
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: process.env.GITHUB_MODEL,
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 4096
                })
              });

              if (!response.ok) {
                const error = await response.text();
                core.setOutput('result', `⚠️ API Error (HTTP ${response.status}): ${error}`);
                return;
              }

              const data = await response.json();
              core.setOutput('result', data.choices[0].message.content);
            } catch (error) {
              core.setOutput('result', `⚠️ Error: ${error.message}`);
            }

      - name: Post comment
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.review.outputs.result }}
        with:
          script: |
            const body = ['## 🤖 AI Code Review', '', process.env.RESULT, '', '---', `*Powered by ${process.env.GITHUB_MODEL_DISPLAY}*`].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  copilot-summary:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/copilot_summary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              title: pr.data.title,
              body: pr.data.body || '',
              commits: commits.data.map(c => c.commit.message).join('\n')
            };

      - name: Get changed files
        id: files
        run: |
          gh pr diff ${{ github.event.issue.number }} --name-only > files.txt
          FILES=$(cat files.txt)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate summary with GitHub Models
        id: summary
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_INFO: ${{ steps.pr.outputs.result }}
          FILES: ${{ steps.files.outputs.files }}
        with:
          script: |
            const prInfo = JSON.parse(process.env.PR_INFO);
            const files = process.env.FILES;
            const prompt = [
              '以下のPull Request情報から、簡潔で分かりやすいサマリーを日本語で作成してください。',
              '',
              '## 出力形式',
              '### 概要',
              '（1-2文で変更の目的を説明）',
              '',
              '### 主な変更点',
              '- 箇条書きで主要な変更を列挙',
              '',
              '### 影響範囲',
              '- 影響を受けるコンポーネントや機能',
              '',
              '### レビューポイント',
              '- レビュアーが特に確認すべき点',
              '',
              '---',
              '',
              '## PR情報',
              `タイトル: ${prInfo.title}`,
              '',
              '説明:',
              prInfo.body,
              '',
              'コミット:',
              prInfo.commits,
              '',
              '変更ファイル:',
              files,
            ].join('\n');

            try {
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: process.env.GITHUB_MODEL,
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 2048
                })
              });

              if (!response.ok) {
                const error = await response.text();
                core.setOutput('result', `⚠️ API Error (HTTP ${response.status}): ${error}`);
                return;
              }

              const data = await response.json();
              core.setOutput('result', data.choices[0].message.content);
            } catch (error) {
              core.setOutput('result', `⚠️ Error: ${error.message}`);
            }

      - name: Post comment
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.summary.outputs.result }}
        with:
          script: |
            const body = ['## 📋 PR Summary', '', process.env.RESULT, '', '---', `*Powered by ${process.env.GITHUB_MODEL_DISPLAY}*`].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

